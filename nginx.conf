# Forge Market's server block.
#
# THE ONE THING TO UNDERSTAND HERE: an unknown path answers 404, not 200.
#
# The usual SPA fallback is `try_files $uri /index.html`, which serves the bundle with a 200 for
# every address in existence. The site does that today, so its "page not found" screen is
# delivered as a success: search engines index it, uptime checks call it healthy, link checkers
# pass, and a deploy that drops a route looks exactly like a deploy that did not.
#
# So the client routes are ENUMERATED below, and everything else falls through to
# `error_page 404 /index.html`, which serves the same bundle while KEEPING the 404 status. React
# renders NotFoundPage inside it, and the status line tells the truth.
#
# The cost is that this list and ROUTES in src/lib/routes.ts must agree. That is one line per
# top-level route, paid once per route, in exchange for an honest status code on every wrong URL.

# ── IS THIS HOSTNAME AN ENVIRONMENT OTHER THAN MAINNET? ────────────────────────────────────────
#
# `map` is in http context, which is why it sits above the server block rather than inside it — a
# conf.d file is included in http, so this is legal here and would not be legal ten lines down.
#
# THE LABELS ARE `ENV_LABELS` FROM @cloudsforge/ui/surfaces, and test/sitemap.test.ts reads that
# export and fails if this alternation has drifted from it. They are the words that name an
# environment rather than a surface: `surfaces.ts` reserves them so that no surface may take one as
# a subdomain, and `deploy/scripts/check-apex-prefix.py` enforces that.
#
# Both shapes are matched. The environment is a SUFFIX on the first label now
# (`market-testnet.cloudsforge.online`) and was an apex prefix (`testnet.cloudsforge.online`)
# before; both still resolve, because surfaces.ts keeps the old one deliberately. A pattern that
# caught only one of them would leave half the estate indexable on testnet.
#
# A non-mainnet environment is not a thing to be indexed at all: it answers `Disallow: /` and
# serves no sitemap. That is not a hedge — a testnet estate carries test EMBER, a faucet and
# deliberately broken states, and every page of it competing with the real one in a search index is
# a support problem before it is an SEO problem.
map $host $cf_env {
    default '';
    ~^(?:[^.]+-)?(?:testnet|staging|preview|dev|mainnet)\. 'yes';
}

server {
    # 8080 because the image is nginx-unprivileged: nothing in this container is root, and a
    # non-root process cannot bind 80.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing is real routing: the address must survive a hard refresh.
    absolute_redirect off;

    # ---- security headers ------------------------------------------------
    # No frame-ancestors beyond self: the bar carries a session, and a product framed by another
    # origin is a clickjacking surface for whatever that session can do.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- assets ----------------------------------------------------------
    # Immutable, because every build emits new hashed filenames. A missing asset is a 404 on its
    # own terms and must NOT fall through to the app shell: a JavaScript request answered with
    # HTML fails with a syntax error that names the wrong file.
    location /assets/ {
        try_files $uri =404;
        # REPEATED, NOT INHERITED. nginx's `add_header` is all-or-nothing per level: a location
        # that declares ANY add_header inherits NONE from its parent. So every location below that
        # sets Cache-Control must restate the security headers, or it silently serves without them
        # — which is exactly what `location /assets/` did, stripping nosniff from every hashed
        # script in every frontend cut from this template.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html is never cached. It is the file that names the current asset hashes, so a stale
    # copy pins a browser to a deploy that no longer exists.
    #
    # AND IT RESTATES THE SECURITY HEADERS, for the reason spelled out in `location /assets/`
    # below. This block declares `add_header`, so it inherits NONE of the server-level ones — and
    # this is not a block that is only reached by a direct request for /index.html:
    # `error_page 404 /index.html` is an INTERNAL REDIRECT, which re-enters location matching. So
    # every honest 404 in this app — the whole point of the enumeration below — was served without
    # nosniff, without X-Frame-Options and without a Referrer-Policy. Inherited from
    # `web-template`, where the same fix was applied to `location /assets/` and `location = /` and
    # this block was missed; reported upstream. `test/routes.test.ts` now asserts it for every
    # block that sets Cache-Control, so it cannot be missed a third time.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the client routes, enumerated -----------------------------------
    # Keep in step with ROUTES in src/lib/routes.ts — test/routes.test.ts asserts they agree.
    location = / {
        try_files /index.html =404;
        # `try_files` is a FILE LOOKUP, not an internal redirect, so serving /index.html here does
        # NOT re-enter `location = /index.html` below — and this location therefore has to declare
        # the shell's no-store itself. Without it `/` shipped with no Cache-Control at all, which
        # is the one document that must never be cached: it names the hashed bundle.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # The alternation is EXACTLY the non-index paths in src/lib/routes.ts, and
    # test/routes.test.ts reads both files and fails the build when they drift. A route added to
    # the router and not here works perfectly under `pnpm dev` and 404s on the first hard refresh.
    location ~ ^/(listings|collections|sell|orders|fees)(/|$) {
        try_files /index.html =404;
        # Same reason as `location = /` above: try_files does not re-enter, so restate both.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the sitemap and robots.txt, composed from $host ------------------
    #
    # WHY THESE ARE HERE AND NOT IN public/
    #
    # A sitemap must carry ABSOLUTE URLs — the spec requires it and a crawler discards a relative
    # `<loc>` — and nothing built in this repository is allowed to name a hostname, because one
    # image is served from localhost, from a preview deployment and from the apex. nginx is the one
    # component that knows: it has `$host` on every request. So the addresses below are composed
    # per request and the artefact stays environment-free.
    #
    # ── THIS SURFACE IS NOT THE APEX, WHICH IS THE WHOLE DIFFERENCE FROM `site` ─────────────────
    #
    # On `site`, `$host` IS the apex, so every sibling surface composes as `<subdomain>.$host` and
    # the shared `sitemapXml()` from @cloudsforge/ui/sitemap emits the estate's whole map. Here
    # `$host` is ALREADY `market.<apex>`, so the same call would compose
    # `foresight.market.cloudsforge.online` — a hostname that exists nowhere, in the one document a
    # crawler treats as authoritative. (It would also fail TLS: Cloudflare's Universal SSL is a
    # one-label wildcard.) The estate sitemap therefore belongs to `site` and to nowhere else, and
    # what is emitted here is THIS surface's own public routes and nothing more.
    #
    # ── WHICH ROUTES, AND WHY THESE THREE ──────────────────────────────────────────────────────
    #
    # `/`, `/collections` and `/fees`: the routes carrying `indexable: true` in src/lib/routes.ts,
    # where the reasoning for each exclusion is written beside the field. In short: /sell and
    # /orders are behind ProtectedRoute and answer a crawler with a redirect to sign in, and
    # /listings/<uuid> and /collections/<uuid> are unbounded sets that a static document cannot
    # enumerate and must not pretend to. All four are still SERVED by the enumeration above — being
    # served and being advertised are different questions.
    #
    # test/sitemap.test.ts reads the route table and this file and fails when they disagree.
    location = /sitemap.xml {
        # `types { }` empties the mime table FOR THIS LOCATION so `default_type` is what applies.
        # Without it nginx maps the `.xml` in the URI to `text/xml` from its own table and the
        # `default_type` line is inert — a declaration that reads as a decision and is not one.
        types { }
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
        # Repeated, not inherited — the rule stated in `location /assets/` above applies to every
        # block in this file that declares any add_header at all.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # An environment that must not be indexed has no sitemap. `return` inside `if` is one of
        # the two uses of `if` in a location that are defined behaviour rather than a trap.
        if ($cf_env) { return 404; }
        return 200 '<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url><loc>$scheme://$host</loc></url>
  <url><loc>$scheme://$host/collections</loc></url>
  <url><loc>$scheme://$host/fees</loc></url>
</urlset>';
    }

    location = /robots.txt {
        types { }
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Every environment but mainnet refuses every crawler, whole.
        if ($cf_env) { return 200 'User-agent: *\nDisallow: /\n'; }
        return 200 'User-agent: *
Allow: /

Sitemap: $scheme://$host/sitemap.xml
';
    }

    # ---- everything else -------------------------------------------------
    # A real file (a favicon, the Open Graph card) is served; anything else 404s, and the error page
    # below turns that 404 into the app shell WITHOUT changing the status.
    #
    # There is no `public/robots.txt` to be shadowed by the exact-match location above, and there
    # must not be one: `location = /robots.txt` wins over this prefix, so a static file would be in
    # the repository, deployed, and unreachable — the worst of the three states, because the next
    # reader edits it and nothing happens.
    location / {
        try_files $uri =404;
    }

    error_page 404 /index.html;

    # nginx's own health, for the container probe. It answers before the app has been fetched, so
    # it says the server is up — never that the app works. That is Beacon's job.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
