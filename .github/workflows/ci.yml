# Continuous integration.
#
# ────────────────────────────────────────────────────────────────────────────────────────────────
# THE `check` AND `image` JOBS BELOW ARE TEMPORARY, for the same two reasons hub-web's and
# foresight-web's are.
#
#   1. @cloudsforge/ui is unpublished, and this repository consumes it as `link:../ui/packages/ui`.
#      The reusable `web-ci.yml` does a single checkout and then `pnpm install --frozen-lockfile`,
#      which cannot resolve a sibling directory that is not there. The day the design system is
#      published and the specifier becomes `^1.0.0`, everything from `check:` to the end of
#      `image:` is deleted and replaced by:
#
#        jobs:
#          ci:
#            uses: cloudsforge-online/micro-org/.github/workflows/web-ci.yml@main
#            with:
#              app: market-web
#              deep-link-path: /listings/11111111-2222-3333-4444-555555555555
#            permissions:
#              contents: read
#              packages: read
#
#   2. The reusable workflow's `image` job checks a deep link returns 200, which this app satisfies
#      — but it cannot also assert that an UNKNOWN path answers 404, and that is the rule this
#      estate's nginx.conf exists to keep. So the image is checked here, where the probe can make
#      both assertions.
#
# The measured target in docs/ecosystem/03 §5 is zero repositories with a bespoke CI file, so treat
# every line from `check:` down as a liability with a deletion date rather than as something to
# extend.
#
# ── BOTH REASONS ABOVE ARE NOW OUT OF DATE, AND THE CONCLUSION STILL HOLDS ───────────────────────
#
# Re-checked against micro-org rather than believed:
#
#   * the single checkout is fixed. web-ci.yml checks the app out into `app/`, micro-ui into
#     `ui/` beside it, and installs THE SIBLING FIRST, because `link:` resolves to the sibling's own
#     node_modules — the shape of the `check:` job below. micro-ui is public now, so even the
#     `estate_token` fallback to `github.token` resolves.
#   * the deep-route probe is fixed, and inverted. web-ci.yml REQUIRES an unknown path to
#     answer 404 and names `try_files $uri /index.html` as the thing not to do; the 200 is now asked
#     only of the optional `deep-link-path` input, a route the app really has.
#
# So the two things that made a bespoke `check:` and `image:` unavoidable are gone. This file is
# still not deleted, because what remains is not a workaround: the `rules:` job below was never
# claimed to be temporary — re-read the first line of this header, it names `check` and
# `image` — and web-ci.yml has no input that could carry it. Its `runtime-hosts` job checks VITE_*,
# build arguments, third-party analytics and the README. It cannot check
#   that every market route names the service that serves it,
#   that no operator-only route is called from this buyer-and-seller surface,
#   or that money is never a float.
#
# Those three steps used to be cited here by line. They are named instead, for the same reason the
# route citations below no longer carry one: a line number goes stale silently and the reader is
# sent to the wrong place with confidence.
#
# Migrating would delete assertions to save a checkout that is already written. What was genuinely
# missing was a PRODUCER — nothing here ever pushed the image it built — and that is what the
# `publish` job at the end of this file adds.
# ────────────────────────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    # `release/**` builds too. A release branch carries the estate-wide version bump, and it
    # has to publish its images before testnet can be deployed from it — which is what proves
    # the release before anything is merged. Mainnet is unaffected: it pins a version tag.
    branches: [main, 'design-system/**', 'release/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: market-web }

      # Temporary, for the same reason as the Dockerfile's second build context: the design system
      # is unpublished and resolves through `link:../ui/packages/ui`.
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-ui
          path: ui
          # micro-ui is private; without a contents:read token this checkout 404s and the job dies
          # before install. Same wiring as the service repos' runtime checkout.
          token: ${{ secrets.ESTATE_READ_TOKEN }}

      # Pinned, because the checkout lives at market-web/ and the action looks for the
      # packageManager field in the workspace root, where there is no package.json.
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: market-web/pnpm-lock.yaml }

      # `link:` resolves to the sibling's own node_modules, so the design system must be installed
      # before this repository is — without this, `tsc` cannot resolve ../ui's own imports (react,
      # react/jsx-runtime) when it typechecks the linked sources.
      - name: Install the sibling design system
        run: pnpm --dir ui install --frozen-lockfile

      - name: Install
        working-directory: market-web
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: market-web
        run: pnpm typecheck

      - name: Test
        working-directory: market-web
        run: pnpm test

      - name: Build
        working-directory: market-web
        run: pnpm build

      # A frontend that builds to nothing is a blank page, not a build failure. The previous estate
      # served SPAs from the API process and shipped an image with no dist in it.
      - name: The bundle exists
        working-directory: market-web
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html is missing after a successful build"; exit 1; }
          echo "ok: $(find dist -type f | wc -l | tr -d ' ') files in dist"

  rules:
    name: Estate rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No build-time configuration
        # The same rule as test/no-build-time-config.test.ts, checked again here so it fails even if
        # somebody deletes the test along with the line it forbids. A `VITE_` variable is read at
        # build time and frozen into the artefact, and an artefact with an environment frozen into
        # it has to be rebuilt to be promoted — which means the thing that reaches production is not
        # the thing that passed CI.
        run: |
          set -uo pipefail
          if grep -rn --include='*.ts' --include='*.tsx' --include='*.html' \
               -e 'import\.meta\.env' -e 'VITE_' src index.html; then
            echo "::error::this bundle must read no build-time environment; hosts come from cloudsforgeHosts() at runtime"
            exit 1
          fi
          echo "ok: no build-time environment"

      - name: No hard-coded CloudsForge hostname
        # A literal hostname is a second, unversioned copy of the surface registry, and the copy is
        # the one that will be wrong.
        run: |
          set -uo pipefail
          if grep -rn --include='*.ts' --include='*.tsx' 'cloudsforge\.online' src; then
            echo "::error::resolve hosts through cloudsforgeHosts() rather than naming them"
            exit 1
          fi
          echo "ok: no literal hostnames in src"

      - name: The SPA fallback keeps its 404
        # Comments are stripped first. nginx.conf's own header QUOTES the directive it forbids, in
        # order to explain why the routes are enumerated by hand, so a grep over the raw file
        # matches the warning and fails a correct config.
        run: |
          set -uo pipefail
          directives=$(grep -v '^[[:space:]]*#' nginx.conf)
          if printf '%s\n' "$directives" | grep -nE 'try_files[[:space:]]+\$uri[[:space:]]+(\$uri/[[:space:]]+)?/index\.html'; then
            echo "::error::unknown paths must 404; serve the shell through error_page 404 /index.html"
            exit 1
          fi
          # `grep -q PATTERN <<<"$var"` rather than `printf '%s\n' "$var" | grep -q PATTERN`.
          # grep -q exits on its first match by design; the producer then writes into a closed pipe,
          # and `pipefail` promoted that SIGPIPE (exit 141) to a failed step — a gate that failed for
          # no reason and passed on re-run, which teaches re-running instead of reading. The here-string
          # is byte-identical input with the same exit status and no pipe, so the rule is unchanged.
          grep -q 'error_page 404 /index.html' <<<"$directives"
          echo "ok: unknown paths answer 404"

      - name: The auth callback is redeemed before the app renders
        # The hand-off code has to leave the address bar before the exchange goes over the wire, and
        # that only happens if bootstrapSession() runs before React mounts.
        run: grep -q 'bootstrapSession' src/main.tsx

      - name: The route table, the navigation and nginx agree
        # Already asserted by test/routes.test.ts; repeated here so deleting the test does not
        # silently delete the rule. A route in the router but not in nginx works under `pnpm dev`
        # and 404s on the first hard refresh in production.
        run: test -f test/routes.test.ts && grep -q 'nginx.conf' test/routes.test.ts

      - name: Every market route names the service that serves it
        # THE RULE THIS REPOSITORY EXISTS TO NOT BREAK AGAIN. Seven clients in this estate were
        # written against imagined surfaces, three of them inside micro-market itself. Every route
        # in src/lib/market.ts is declared against `market/src/server.ts`, read out of
        # buildRoutes(), and test/market.test.ts asserts the REQUEST rather than the response.
        #
        # ── WHY THIS STEP NAMES ROUTES AND NOT LINE NUMBERS ANY MORE ──────────────────────────
        #
        # It used to loop over nineteen hardcoded line numbers and require src/lib/market.ts to
        # cite each one. A line number names a position in a file micro-market OWNS and is free to
        # edit, so this repository went red for edits that broke nothing here — and nothing runs
        # this workflow when that service changes, so it surfaced during a release. Worse, the
        # numbers had already gone wrong in the other direction and passed anyway: 893 was cited
        # as GET /v1/listings/:id/offers and today lands in the middle of the listing-bounty block,
        # because this step only ever checked that the CLIENT wrote the number down.
        #
        # A route name cannot drift. It is also four routes stronger: the image surface was added
        # without a line and so was never covered by the old loop at all.
        run: |
          set -uo pipefail
          routes='GET /v1/collections
          POST /v1/collections
          GET /v1/listings
          GET /v1/listings/:id
          POST /v1/listings
          POST /v1/listings/:id/activate
          DELETE /v1/listings/:id
          GET /v1/listings/:id/risk
          POST /v1/listings/:id/buy
          GET /v1/listings/:id/bids
          POST /v1/listings/:id/bids
          GET /v1/listings/:id/offers
          POST /v1/listings/:id/offers
          DELETE /v1/offers/:id
          POST /v1/offers/:id/accept
          GET /v1/orders
          GET /v1/orders/:id
          POST /v1/orders/:id/disputes
          GET /v1/verifications/:urn
          GET /v1/images/config
          POST /v1/listings/:id/images
          PUT /v1/listings/:id/images
          DELETE /v1/listings/:id/images/:assetId'
          n=0
          while IFS= read -r route; do
            route=$(echo "$route" | sed 's/^ *//')
            [ -n "$route" ] || continue
            grep -qF "\`$route\` — **\`market/src/server.ts\`**" src/lib/market.ts \
              || { echo "::error::src/lib/market.ts does not declare $route against market/src/server.ts"; exit 1; }
            n=$((n + 1))
          done <<<"$routes"
          [ "$n" -eq 23 ] || { echo "::error::checked $n routes, not 23; this step is reading nothing"; exit 1; }
          echo "ok: $n routes, each naming the service source it was read from"

      - name: No operator-only route is called from this buyer-and-seller surface
        # GET /v1/disputes, the moderation routes, PUT /v1/verifications and POST /v1/events
        # (all in `market/src/server.ts`) require an operator or a signed event. Calling one would
        # be building a 403 into a page and then explaining it.
        run: |
          set -uo pipefail
          if grep -rn --include='*.ts' --include='*.tsx' \
               -e "api('/v1/disputes" -e "api('/v1/moderation" -e "api('/v1/events" src; then
            echo "::error::an operator-only route is called from a public surface"
            exit 1
          fi
          echo "ok: no operator-only route is called"

      - name: Money is never a float
        # `parseFloat` or `toFixed` near an amount loses the bottom of an 18-decimal value — and
        # every amount on this surface is a bigint of smallest units, where the bottom is exactly
        # where a fee and a royalty land.
        #
        # COMMENTS ARE STRIPPED FIRST, and that is not a convenience. The naive version of this
        # step failed on its first run against correct code: `src/lib/money.ts` DOCUMENTS the two
        # functions it forbids ("There is no `Number()`, no `parseFloat` and no `toFixed` anywhere
        # in this file"), so a grep over the raw source matched the file's own explanation of the
        # rule. Exactly the trap `nginx.conf`'s header describes, and the estate has now hit it
        # twice. A guard that fails on correct code is a guard somebody deletes.
        run: |
          set -uo pipefail
          sources=$(find src -name '*.ts' -o -name '*.tsx')
          hits=0
          for file in $sources; do
            stripped=$(sed -e 's|//.*$||' -e 's|^[[:space:]]*\*.*$||' -e 's|/\*.*\*/||' "$file")
            if printf '%s\n' "$stripped" | grep -nE 'parseFloat|toFixed' ; then
              echo "::error file=${file}::amounts are bigint end to end; see src/lib/money.ts"
              hits=1
            fi
          done
          [ "$hits" = "0" ] || exit 1
          echo "ok: no float arithmetic near an amount"

      - name: An unknown escrow is never rendered as an unconfirmed one
        # The defect this repository was briefed on. `escrowIsUnknown` and `escrowIsUnconfirmed`
        # are separate booleans so that a careless `!confirmed` cannot collapse them, and the test
        # asserts both directions on every branch.
        run: |
          set -uo pipefail
          grep -q 'escrowIsUnknown' src/lib/escrow.ts
          grep -q 'escrowIsUnconfirmed' src/lib/escrow.ts
          grep -q 'could_not_confirm' test/escrow.test.ts
          grep -q 'not_confirmed' test/escrow.test.ts
          echo "ok: the two are separate facts, and both are tested"

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: market-web }
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-ui
          path: ui
          token: ${{ secrets.ESTATE_READ_TOKEN }}

      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: market-web
          build-contexts: uipkg=ui
          build-args: RELEASE=${{ github.sha }}
          push: false
          load: true
          tags: market-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image serves the SPA, and 404s an address it does not own
        run: |
          set -euo pipefail
          docker run -d --name ci-market-web -p 127.0.0.1:55630:8080 market-web:ci
          for attempt in $(seq 1 20); do
            code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:55630/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "${code:-}" = "200" ] || { echo "::error::the image returned ${code:-no answer} for /"; docker logs --tail 60 ci-market-web; exit 1; }

          # A route this app OWNS must survive a hard refresh. A listing page is the address people
          # paste at each other, so it is the one worth proving.
          deep=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:55630/listings/11111111-2222-3333-4444-555555555555 || true)
          [ "$deep" = "200" ] || { echo "::error::a listing deep link returned $deep — an owned route must be served the shell"; exit 1; }

          order=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:55630/orders/11111111-2222-3333-4444-555555555555 || true)
          [ "$order" = "200" ] || { echo "::error::an order deep link returned $order"; exit 1; }

          fees=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:55630/fees || true)
          [ "$fees" = "200" ] || { echo "::error::/fees returned $fees"; exit 1; }

          # A route it does NOT own must answer 404 while still serving the shell, so the reader
          # gets a real page and the status line tells the truth. This is the assertion the org's
          # reusable image job cannot make, because it requires a 200 for any deep link.
          unknown=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:55630/nope/not/a/route || true)
          [ "$unknown" = "404" ] || { echo "::error::an unknown address returned $unknown; it must be 404"; exit 1; }
          curl -s -m 5 http://127.0.0.1:55630/nope/not/a/route | grep -q '<div id="root">' \
            || { echo "::error::the 404 did not serve the app shell"; exit 1; }

          # A missing asset must 404 on its own terms rather than being answered with HTML.
          asset=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:55630/assets/does-not-exist.js || true)
          [ "$asset" = "404" ] || { echo "::error::a missing asset returned $asset"; exit 1; }

          # The image must carry no environment file.
          docker run --rm --entrypoint sh market-web:ci -c 'ls -a /usr/share/nginx/html | grep -c "^\.env" || true' | grep -qx 0 \
            || { echo "::error::an env file reached the image"; exit 1; }

          echo "ok: owned routes are served, unknown addresses 404 with the shell, no env in the image"

      - name: Every response carries the security headers, including the honest 404
        # `add_header` DOES NOT ACCUMULATE: a location declaring any add_header inherits none from
        # its parent. `error_page 404 /index.html` is an INTERNAL REDIRECT, so the honest 404 is
        # served by `location = /index.html` — which in the template sets Cache-Control and nothing
        # else, shipping every 404 in the app without nosniff. Probed rather than read, because
        # probing a running container is the only way this class of defect has ever been found here.
        run: |
          set -euo pipefail
          probe() {
            path="$1"; header="$2"
            value=$(curl -s -m 5 -D - -o /dev/null "http://127.0.0.1:55630${path}" | grep -i "^${header}:" || true)
            [ -n "$value" ] || { echo "::error::${path} is missing ${header}"; exit 1; }
            printf '  %s -> %s' "$path" "$value"
          }
          for path in / /fees /listings/11111111-2222-3333-4444-555555555555 /nope/not/a/route; do
            probe "$path" 'X-Content-Type-Options'
            probe "$path" 'X-Frame-Options'
            probe "$path" 'Referrer-Policy'
            probe "$path" 'Cache-Control'
          done
          # And a hashed asset, which is where the estate found this the first time.
          asset=$(curl -s -m 5 http://127.0.0.1:55630/ | grep -o '/assets/[^"]*\.js' | head -1)
          [ -n "$asset" ] || { echo "::error::the shell names no hashed script"; exit 1; }
          probe "$asset" 'X-Content-Type-Options'
          probe "$asset" 'Cache-Control'
          echo "ok: every response carries the four headers"

      - name: Down
        if: always()
        run: docker rm -f ci-market-web || true

  hygiene:
    # The org's reusable secret check. Cheap, and it catches the failure that cannot be undone: a
    # secret pushed to a repository is compromised the moment it lands, and rotating it is the only
    # remedy.
    uses: cloudsforge-online/micro-org/.github/workflows/secret-hygiene.yml@main
    permissions:
      contents: read

  # ────────────────────────────────────────────────────────────────────────────────────────────────
  # THE IMAGE, PUBLISHED. Until this job existed the `image:` job above built this image and threw
  # it away, so the release path could not name it. Every line number below was read off the source,
  # not off the prose that cites it — the numbers in micro-org's own publish-image.yml header have
  # already drifted:
  #
  #   generator  `cfctl release` pins one image per deployable, the name from
  #              org/tools/registry.ts (`ghcr.io/<org>/<repo.repo>`, which is why the package
  #              is micro-<app> and not <app>) and the tag from that repository's package.json
  #              version, org/tools/cfctl.ts.
  #   verifier   `cfctl release --verify` runs `docker manifest inspect` on EVERY entry and returns
  #              non-zero if one cannot be pulled, org/tools/cfctl.ts.
  #   deployer   deploy/scripts/release-deploy.sh refuses to change anything while any image
  #              is missing.
  #
  # A frontend with no producer was therefore a manifest entry that could never verify.
  #
  # `packages: write` IS GRANTED HERE and not asked for inside the shared workflow, which is forced
  # rather than stylistic: a called workflow's GITHUB_TOKEN can only be maintained or reduced, never
  # elevated, so a reusable workflow asking for a permission its caller withheld fails the run at
  # STARTUP, before a step runs. Measured on micro-org: run 30900277471 (caller capped at
  # `packages: read`) ended in startup_failure; run 30900280323 (same workflow, caller granting
  # `packages: write`) succeeded. That is also why `push: false` stays in the `image:` job above —
  # that job is a GATE and needs `load:` so it can boot the container and probe it. This is the
  # producer. Different purposes, so different jobs.
  #
  # `needs:` names EVERY other job, so nothing is published that did not pass every gate here.
  # ────────────────────────────────────────────────────────────────────────────────────────────────
  publish:
    needs: [check, rules, image, hygiene]
    # A green push to main and nothing else. An image tag a release manifest pins has to name
    # something that passed, on the branch it will be deployed from.
    if: >-
      github.event_name == 'push' && (github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/design-system/') ||
      startsWith(github.ref, 'refs/heads/release/'))
    uses: cloudsforge-online/micro-org/.github/workflows/publish-image.yml@main
    with:
      # `web`, so the producer checks micro-ui out as the `uipkg` named build context this
      # repository's Dockerfile reads at line 24. It names ONLY the contexts its kind checked
      # out, because buildx stats every named context before it opens the Dockerfile.
      kind: web
    secrets:
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: write
